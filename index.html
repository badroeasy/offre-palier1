<title>L'offre EcomLiberty en test</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">
<style>
  /* Trois écrans du même parcours : la page de vente d'une porte, l'écran qui
     suit le paiement, le catalogue une fois dedans. Sol gris, feuille blanche,
     un pastel par palier, l'encre pour tout ce qui agit. */
  :root {
    --sol: #ecedf1;
    --feuille: #ffffff;
    --creux: #f7f7f8;
    --encre: #0b1233;
    --doux: #5b6280;
    --trait: #e2e6f3;
    --palier-1: #dff0f3;
    --palier-2: #e9e5f8;
    --palier-3: #fde7eb;
    --vert: #16a34a;
    --vert-voile: #eaf7ef;
    --ambre: #b45309;
    --ambre-voile: #fdf3e6;
    --xp: #ffc83d;
    --police: 'DM Sans', ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif;
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--sol); color: var(--encre);
         font: 400 15px/1.6 var(--police); -webkit-font-smoothing: antialiased; }
  .affiche { font-weight: 700; letter-spacing: -0.03em; line-height: 1.1; }
  .nums { font-variant-numeric: tabular-nums; }
  h1, h2, h3, h4 { text-wrap: balance; }
  img { max-width: 100%; }

  /* ── La barre de test, hors du produit ──────────────────────────────── */
  .test {
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
    background: var(--encre); color: #fff;
  }
  body::before { content: ""; position: fixed; inset: 0 0 auto;
                 height: env(safe-area-inset-top, 0px); z-index: 21; background: var(--encre); }
  .test .dedans {
    max-width: 1100px; margin: 0 auto; display: flex; flex-wrap: wrap;
    align-items: center; gap: 8px 14px; padding-block: 10px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .test .mot { font-size: 11px; letter-spacing: 0.09em; text-transform: uppercase; opacity: 0.6; }
  .test .choix { display: flex; gap: 6px; flex-wrap: wrap; }
  .test button {
    border: 1px solid rgb(255 255 255 / 0.25); background: none; color: #fff;
    border-radius: 999px; padding: 6px 13px; font: 500 13px var(--police); cursor: pointer;
  }
  .test button[aria-pressed='true'] { background: #fff; color: var(--encre); font-weight: 700; border-color: #fff; }
  .test button:focus-visible { outline: 2px solid var(--xp); outline-offset: 2px; }

  .page {
    max-width: 1100px; margin: 0 auto; padding-block: 24px 48px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  .large { max-width: 1680px; }

  /* ── Marque ─────────────────────────────────────────────────────────── */
  .marque { display: flex; align-items: center; gap: 10px; }
  .marque img { width: 32px; height: 32px; border-radius: 9px; }
  .marque span { font-weight: 700; font-size: 16px; letter-spacing: -0.01em; }

  /* ── Page de vente ──────────────────────────────────────────────────── */
  .vente { display: grid; gap: 20px; margin-top: 22px; }
  @media (min-width: 900px) { .vente { grid-template-columns: 1fr 360px; align-items: start; } }

  .bloc { background: var(--feuille); border-radius: 18px; padding: 20px;
          box-shadow: 0 1px 2px rgb(16 24 40 / 0.05); }
  @media (min-width: 640px) { .bloc { padding: 26px; } }

  .chapeau { font-size: 12px; font-weight: 700; letter-spacing: 0.07em;
             text-transform: uppercase; color: var(--ambre); }
  .vente h1 { margin: 10px 0 0; font-size: 28px; }
  @media (min-width: 640px) { .vente h1 { font-size: 38px; } }
  .vente .sous { margin: 12px 0 0; color: var(--doux); font-size: 16px; max-width: 48ch; }

  .visuel { aspect-ratio: 16/9; border-radius: 14px; overflow: hidden; margin-top: 20px; background: var(--creux); }
  .visuel img { width: 100%; height: 100%; object-fit: cover; display: block; }
  /* La porte large n'a pas d'image à elle : les quatre étapes font le visuel,
     dans l'ordre. Deux colonnes sur téléphone — à quatre, chaque vignette
     tomberait sous 70 px et on ne verrait plus ce qu'elle montre. */
  .chaine { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 20px; }
  .chaine figure { margin: 0; min-width: 0; }
  .chaine img { width: 100%; aspect-ratio: 16/9; object-fit: cover;
                border-radius: 10px; display: block; background: var(--creux); }
  .chaine figcaption { display: flex; gap: 6px; margin-top: 6px; color: var(--doux);
                       font-size: 12px; line-height: 1.3; }
  .chaine figcaption b { color: var(--encre); font-variant-numeric: tabular-nums; }
  @media (min-width: 720px) { .chaine { grid-template-columns: repeat(4, 1fr); } }
  .note-test code { font: 600 11.5px ui-monospace, monospace; opacity: 0.75; }

  .liste { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 10px; }
  .liste li { display: flex; gap: 10px; align-items: flex-start; font-size: 15px; }
  .coche { flex-shrink: 0; width: 20px; height: 20px; border-radius: 999px;
           background: var(--vert-voile); color: var(--vert); display: grid; place-items: center; margin-top: 2px; }

  .titre-sec { margin: 0 0 4px; font-size: 19px; font-weight: 700; letter-spacing: -0.02em; }
  .sec-sous { margin: 0 0 14px; color: var(--doux); font-size: 14px; }

  .bonus { background: var(--vert-voile); border-radius: 18px; padding: 20px; margin-top: 20px; }
  @media (min-width: 640px) { .bonus { padding: 26px; } }
  .bonus .titre-sec { color: var(--vert); }
  .bonus-grille { display: grid; gap: 10px; margin-top: 14px; }
  @media (min-width: 620px) { .bonus-grille { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .bonus-ligne { display: flex; gap: 12px; align-items: center; background: var(--feuille);
                 border-radius: 12px; padding: 10px 12px; min-width: 0; }
  .bonus-ligne img { width: 54px; height: 32px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
  .bonus-ligne div { min-width: 0; }
  .bonus-ligne b { display: block; font-size: 13.5px; font-weight: 700; line-height: 1.3; }
  .bonus-ligne small { color: var(--doux); font-size: 12px; }

  /* ── Le panneau de prix ─────────────────────────────────────────────── */
  .prix-panneau { position: sticky; top: 76px; }
  .prix-chapeau { margin: 0 0 10px; color: var(--doux); font-size: 12px; letter-spacing: 0.06em;
                  text-transform: uppercase; font-weight: 700; }
  /* Le montant barre est celui qu'il ne paie PAS aujourd'hui, et le mot
     « d'un coup » le dit : barrer 20 000 sans ça annoncerait une remise
     qui n'existe pas. */
  .prix-avant { margin: 0; display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; }
  .prix-avant s { color: var(--doux); font-size: 19px; font-weight: 600;
                  text-decoration-thickness: 2px; text-decoration-color: var(--vert); }
  .prix-avant span { color: var(--doux); font-size: 13px; }
  .prix-grand { margin: 2px 0 0; font-size: 40px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.05; }
  .prix-grand span { font-size: 17px; font-weight: 600; letter-spacing: 0; color: var(--doux); }
  .prix-sous { margin: 8px 0 0; color: var(--doux); font-size: 14px; }
  .prix-note { margin: 8px 0 0; color: var(--doux); font-size: 12.5px; line-height: 1.45; }
  .prix-deux { margin: 12px 0 0; display: flex; gap: 8px; }
  .prix-deux div { flex: 1; background: var(--creux); border-radius: 10px; padding: 9px 10px; }
  .prix-deux b { display: block; font-size: 15px; }
  .prix-deux small { display: block; color: var(--doux); font-size: 11.5px; line-height: 1.35; margin-top: 2px; }
  .bouton {
    display: block; width: 100%; margin-top: 18px; border: 0; border-radius: 999px;
    background: var(--encre); color: var(--feuille);
    padding: 15px 20px; font: 700 15px var(--police); text-align: center; cursor: pointer;
  }
  .bouton:active { transform: scale(0.985); }
  .bouton.clair { background: var(--feuille); color: var(--encre); box-shadow: inset 0 0 0 1px var(--trait); }
  /* Le second bouton existe pour être vu, pas pour être choisi : même largeur,
     mais plus bas, plus petit, sans aplat. Deux boutons noirs côte à côte
     feraient hésiter au lieu d'aider. */
  /* Sur un panneau blanc, un bouton blanc n'est qu'un liseré : il faut un
     creux pour qu'on le voie, sans qu'il concurrence l'aplat noir. */
  .bouton.clair.petit { margin-top: 8px; padding: 12px 16px; font-size: 13.5px;
                        background: var(--creux); }
  .bouton:focus-visible { outline: 2px solid var(--encre); outline-offset: 3px; }
  .moyens { margin: 16px 0 0; padding-top: 16px; border-top: 1px solid var(--trait);
            color: var(--doux); font-size: 13px; }
  .moyens b { display: block; color: var(--encre); font-size: 12px; letter-spacing: 0.06em;
              text-transform: uppercase; margin-bottom: 8px; }
  .jetons { display: flex; flex-wrap: wrap; gap: 6px; }
  .jeton { border: 1px solid var(--trait); border-radius: 8px; padding: 5px 9px;
           font-size: 12.5px; color: var(--encre); background: var(--creux); }
  .rassure { margin: 14px 0 0; color: var(--doux); font-size: 13px; }
  .bouton-wa {
    display: flex; align-items: center; justify-content: center; gap: 9px;
    margin-top: 14px; border-radius: 999px; padding: 11px 14px;
    background: var(--vert-voile); color: #0f7a37; text-decoration: none;
    box-shadow: inset 0 0 0 1px #9ddcb4; text-align: left;
  }
  .bouton-wa span { font-size: 13.5px; font-weight: 700; line-height: 1.25; }
  .bouton-wa em { display: block; font-style: normal; font-weight: 600;
                  font-size: 12.5px; opacity: 0.8; font-variant-numeric: tabular-nums; }
  .bouton-wa:active { transform: scale(0.985); }
  .bouton-wa:focus-visible { outline: 2px solid #0f7a37; outline-offset: 3px; }

  /* ── Écran après paiement ───────────────────────────────────────────── */
  .recu { background: var(--vert-voile); border-radius: 18px; padding: 22px; text-align: center; margin-top: 22px; }
  .recu .pastille { width: 46px; height: 46px; border-radius: 999px; background: var(--vert);
                    color: #fff; display: grid; place-items: center; margin: 0 auto 12px; }
  .recu h1 { margin: 0; font-size: 24px; }
  .recu p { margin: 8px auto 0; color: var(--doux); max-width: 44ch; font-size: 15px; }
  /* L'échéance se dit ici et nulle part avant : sur la page de vente, elle se
     lit comme une menace ; une fois payé, c'est un service. */
  .recu .versement { margin: 14px auto 0; max-width: 44ch; background: var(--feuille);
                     border-radius: 12px; padding: 10px 14px; font-size: 14px; }
  .recu .versement b { color: var(--encre); }

  .offre { background: var(--feuille); border-radius: 18px; padding: 22px; margin-top: 16px;
           box-shadow: 0 1px 2px rgb(16 24 40 / 0.05); }
  @media (min-width: 640px) { .offre { padding: 28px; } }
  .trois { display: grid; gap: 12px; margin: 16px 0 0; }
  @media (min-width: 620px) { .trois { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .mini { border: 1px solid var(--trait); border-radius: 14px; overflow: hidden; background: var(--feuille); }
  .mini img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; }
  .mini div { padding: 10px 12px; }
  .mini b { display: block; font-size: 13.5px; line-height: 1.3; }
  .mini small { color: var(--doux); font-size: 12px; }

  .compte { display: grid; gap: 8px; margin-top: 18px; padding: 16px; border-radius: 14px; background: var(--creux); }
  .compte .l { display: flex; justify-content: space-between; gap: 16px; font-size: 14.5px; }
  .compte .l.total { border-top: 1px solid var(--trait); padding-top: 10px; margin-top: 2px;
                     font-weight: 700; font-size: 16px; }
  .barre-prix { text-decoration: line-through; color: var(--doux); }
  .gain { color: var(--vert); font-weight: 700; }

  /* ── Le catalogue, dans la plateforme ───────────────────────────────── */
  .carte { display: flex; background: var(--feuille); border-radius: 24px; margin-top: 22px;
           box-shadow: 0 8px 16px -8px rgb(16 24 40 / 0.1), 0 32px 64px -24px rgb(16 24 40 / 0.16); }
  @media (max-width: 767px) { .carte { flex-direction: column; } }
  .rail { background: var(--creux); border-bottom: 1px solid var(--trait);
          border-radius: 24px 24px 0 0; flex-shrink: 0; }
  @media (min-width: 768px) {
    .rail { width: 88px; border-bottom: 0; border-right: 1px solid var(--trait); border-radius: 24px 0 0 24px; }
  }
  .tete { display: none; height: 64px; align-items: center; justify-content: center; border-bottom: 1px solid var(--trait); }
  @media (min-width: 768px) { .tete { display: flex; } }
  .tete img { width: 34px; height: 34px; border-radius: 10px; }
  .liens { display: flex; gap: 4px; overflow-x: auto; padding: 8px; scrollbar-width: none; }
  .liens::-webkit-scrollbar { display: none; }
  @media (min-width: 768px) { .liens { flex-direction: column; gap: 6px; padding: 16px 10px; } }
  .onglet { display: flex; flex-direction: column; align-items: center; gap: 4px; flex-shrink: 0;
            padding: 10px 12px; border-radius: 16px; color: var(--doux); font-size: 11px; text-align: center; }
  @media (min-width: 768px) { .onglet { padding: 12px 4px; } }
  .onglet[data-actif] { background: var(--feuille); color: var(--encre); font-weight: 700;
                        box-shadow: 0 1px 2px rgb(16 24 40 / 0.06); }
  .colonne { flex: 1; min-width: 0; }
  .barre-app { display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 16px;
               border-bottom: 1px solid var(--trait); }
  @media (min-width: 640px) { .barre-app { padding: 0 24px; } }
  .barre-app h2 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.015em; }
  .avatar { margin-left: auto; width: 34px; height: 34px; border-radius: 999px; background: #1a6ef5;
            color: #fff; display: grid; place-items: center; font-size: 12.5px; font-weight: 700; }
  .dedans-app { padding: 22px 16px 32px; }
  @media (min-width: 640px) { .dedans-app { padding: 28px 24px 40px; } }

  .section-titre { display: flex; align-items: center; gap: 10px; padding-bottom: 10px;
                   margin: 30px 0 14px; border-bottom: 1px solid var(--trait); }
  .section-titre:first-child { margin-top: 0; }
  .numeral { width: 34px; height: 34px; flex-shrink: 0; border-radius: 10px; border: 1px solid;
             display: grid; place-items: center; font-weight: 700; font-size: 15px; }
  .numeral.n1 { background: rgb(13 148 136 / 0.08); border-color: rgb(13 148 136 / 0.4); color: #0f766e; }
  .numeral.n2 { background: rgb(124 58 237 / 0.07); border-color: rgb(124 58 237 / 0.4); color: #6d28d9; }
  .numeral.n3 { background: rgb(225 29 72 / 0.07); border-color: rgb(225 29 72 / 0.4); color: #be123c; }
  .section-titre h3 { margin: 0; font-size: 16px; font-weight: 700; letter-spacing: -0.015em; }
  .section-titre p { margin: 0; color: var(--doux); font-size: 12px; }
  .section-titre .droite { margin-left: auto; flex-shrink: 0; }

  .grille { display: grid; gap: 14px; grid-template-columns: 1fr; align-items: start; }
  @media (min-width: 620px) { .grille { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (min-width: 1000px) { .grille { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

  .tuile { border-radius: 16px; overflow: hidden; box-shadow: 0 1px 2px rgb(16 24 40 / 0.06);
           display: flex; flex-direction: column; }
  .tuile .haut { padding: 11px; }
  .tuile.p1 .haut { background: var(--palier-1); }
  .tuile.p2 .haut { background: var(--palier-2); }
  .tuile.p3 .haut { background: var(--palier-3); }
  .tuile .vign { position: relative; aspect-ratio: 16/9; border-radius: 11px; overflow: hidden;
                 background: rgb(255 255 255 / 0.6); }
  .tuile .vign img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .tuile.ferme .vign img { opacity: 0.45; }
  .cadenas { position: absolute; inset: 0; display: grid; place-items: center; }
  .cadenas span { width: 34px; height: 34px; border-radius: 999px; background: rgb(11 18 51 / 0.72);
                  color: #fff; display: grid; place-items: center; }
  .tuile .corps { padding: 12px 3px 2px; }
  .tuile h4 { margin: 0; font-size: 14.5px; font-weight: 700; line-height: 1.35; }
  .tuile .info { margin: 6px 0 0; color: rgb(11 18 51 / 0.65); font-size: 12px; }
  .tuile .pied { display: flex; align-items: center; justify-content: space-between; gap: 10px;
                 padding: 11px 14px; background: var(--feuille); }
  .etat { font-size: 12px; font-weight: 700; }
  .etat.a-toi { color: var(--vert); }
  .etat.offert { color: var(--vert); }
  .etat.ferme { color: var(--ambre); }
  .bouton-mini { border-radius: 999px; padding: 7px 14px; font-size: 12px; font-weight: 700;
                 background: var(--encre); color: var(--feuille); flex-shrink: 0; }
  .bouton-mini.calme { background: var(--creux); color: var(--doux); }

  .bandeau-palier { border-radius: 18px; padding: 18px; margin-top: 14px; display: flex;
                    flex-wrap: wrap; align-items: center; gap: 14px; }
  .bandeau-palier.p2 { background: var(--palier-2); }
  .bandeau-palier.p3 { background: var(--palier-3); }
  .bandeau-palier div { min-width: 0; flex: 1; }
  .bandeau-palier b { display: block; font-size: 15px; }
  .bandeau-palier small { color: rgb(11 18 51 / 0.7); font-size: 13px; }

  .note-test { background: var(--ambre-voile); border-radius: 14px; padding: 14px 16px;
               margin-top: 20px; color: var(--ambre); font-size: 13.5px; }
  .note-test b { display: block; margin-bottom: 2px; }

  /* ── Les sommaires ──────────────────────────────────────────────────
     Montrer chaque titre de leçon est l'argument de vente le plus fort
     qu'on ait : on n'achète pas « 7 leçons », on achète « Le Sourcing
     Intra-Régional ». Le sommaire de la formation achetée est ouvert ;
     ceux des bonus et des blocs fermés se déplient. */
  .sommaire { margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--trait); }
  ol.lecons { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 2px; }
  ol.lecons li { display: flex; gap: 10px; align-items: baseline; padding: 9px 11px;
                 border-radius: 9px; font-size: 14px; }
  ol.lecons li:nth-child(odd) { background: var(--creux); }
  ol.lecons .n { flex-shrink: 0; width: 18px; color: var(--doux); font-size: 12px;
                 font-variant-numeric: tabular-nums; }
  ol.lecons .t { flex: 1; min-width: 0; }
  ol.lecons .d { flex-shrink: 0; color: var(--doux); font-size: 12.5px;
                 font-variant-numeric: tabular-nums; }
  ol.lecons .cle { flex-shrink: 0; color: var(--ambre); display: inline-flex; }

  details > summary { cursor: pointer; list-style: none; }
  details > summary::-webkit-details-marker { display: none; }
  details > summary:focus-visible { outline: 2px solid var(--encre); outline-offset: 2px; border-radius: 10px; }
  .chevron { flex-shrink: 0; color: var(--doux); transition: transform .15s; }
  details[open] .chevron { transform: rotate(180deg); }

  .voir { display: flex; align-items: center; justify-content: space-between; gap: 10px;
          padding: 11px 14px; border-top: 1px solid var(--trait); background: var(--feuille);
          font-size: 12.5px; font-weight: 700; color: var(--doux); }
  .tuile details ol.lecons { padding: 4px 10px 12px; background: var(--feuille); margin: 0; }
  .tuile details ol.lecons li { font-size: 13px; padding: 7px 8px; }

  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>

<div class="test">
  <div class="dedans">
    <span class="mot">Lien de test</span>
    <div class="choix" id="choix">
      <button type="button" data-vue="vente" aria-pressed="true">1 · La pub mène ici</button>
      <button type="button" data-vue="apres" aria-pressed="false">2 · Après le paiement</button>
      <button type="button" data-vue="dedans" aria-pressed="false">3 · Une fois dedans</button>
    </div>
  </div>
</div>

const WA_ICONE = `<svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.347-.347.52-.52.174-.173.232-.297.347-.495.115-.198.057-.371-.058-.52-.115-.148-.652-1.57-.893-2.148-.213-.52-.43-.43-.594-.43-.173 0-.372-.025-.57-.025-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>`;
let planChoisi = 'plein';
const PRIX = { entree: 20000, acompte: 10000, reste: 10000, jours: 14, suite: 77000, total: 97000 };

const ech = (t) => String(t).replace(/[&<>"]/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// L'espace insécable sépare les milliers : « 20 000 F CFA » ne doit jamais se
// couper en bout de ligne sur un téléphone.
const fcfa = (n) => n.toLocaleString('fr-FR').replace(/ |\s/g, ' ') + ' F CFA';
const temps = (m) => (m >= 60 ? Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0') : m + ' min');
// La date est calculée à l'ouverture de la page : une date écrite en dur serait
// passée demain, et sur un lien de test c'est ce qu'on remarque en premier.
const ENMOTS = ['zéro', 'une', 'deux', 'trois', 'quatre', 'cinq'];
const dansJours = (n) =>
  new Date(Date.now() + n * 864e5).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' });

const COCHE = '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 13 4 4L19 7"/></svg>';
const VERROU = '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>';
const CHEVRON = '<svg class="chevron" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
const PETITE_CLE = '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="4" y="10" width="16" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>';

/** Le sommaire d'un bloc : une ligne par leçon, numérotée, avec sa durée. */
function sommaire(cover, ferme) {
  const l = LECONS[cover] || [];
  if (l.length === 0) return '<p class="rassure">Les leçons arrivent.</p>';
  return `<ol class="lecons">${l.map(([titre, min], i) => `
    <li>
      <span class="n">${String(i + 1).padStart(2, '0')}</span>
      <span class="t">${ech(titre)}</span>
      ${ferme ? `<span class="cle">${PETITE_CLE}</span>` : ''}
      <span class="d">${min} min</span>
    </li>`).join('')}</ol>`;
}

const marque = () =>
  `<div class="marque"><img src="${MARQUE}" alt=""><span>EcomLiberty</span></div>`;

/** Une ligne de bloc inclus, dépliable sur son sommaire. */
const ligneIncluse = (b, achete) => `
  <details class="bonus-ligne" style="display:block">
    <summary style="display:flex;gap:12px;align-items:center;min-width:0">
      <img src="couv/${b.cover}" alt="">
      <div style="min-width:0;flex:1">
        <b>${ech(b.nom)}${achete ? ' — celle que tu achètes' : ''}</b>
        <small>${b.lecons} leçons · ${temps(b.min)}</small>
      </div>
      ${CHEVRON}
    </summary>
    ${sommaire(b.cover, false)}
  </details>`;

/* ── 1. La page où mène la publicité ─────────────────────────────────── */
function vueVente() {
  const p = laPorte();
  // Sur la porte large, les « étapes suivantes » sont les quatre : elle n'en
  // retire aucune, puisqu'elle ne promet pas une étape mais le chemin.
  const suivantes = p.large ? PORTES : PORTES.filter((x) => x.cle !== p.cle);
  const reste = PALIER1.filter((x) => !x.porte);
  return `
  <div class="page">
    ${marque()}
    <div class="vente">
      <div>
        <div class="bloc">
          <p class="chapeau">
            ${p.large ? 'Formation complète' : 'Formation'} · ${p.lecons} leçons · ${temps(p.min)}

            <li><span class="coche">${COCHE}</span><span><b>En français, avec des exemples d’ici</b> — pas des captures d’écran américaines.</span></li>
          </ul>

          ${p.large ? '' : `
          <div class="sommaire">
            <h2 class="titre-sec">Le sommaire complet</h2>
            <p class="sec-sous">Les ${p.lecons} leçons, dans l’ordre. Tu vois tout avant de payer.</p>
            ${sommaire(p.cover, false)}
          </div>`}
        </div>

        <div class="bonus">
          <h2 class="titre-sec">
            ${p.large ? 'Le chemin, dans l’ordre' : 'Et la suite du chemin est dedans'}
          </h2>
          <p class="sec-sous">
            ${p.large
              ? 'Les quatre étapes, dans l’ordre où on les fait. Déplie-les : tu vois chaque leçon avant de payer.'
              : `${ech(p.pont)} Les ${ENMOTS[suivantes.length] || suivantes.length} étapes qui restent sont comprises, au même prix.`}
          </p>
          <div class="bonus-grille">
            ${suivantes.map((b) => ligneIncluse(b)).join('')}
          </div>

          <h2 class="titre-sec" style="margin-top:22px">Plus six formations pour tenir la route</h2>
          <p class="sec-sous">${reste.reduce((a, b) => a + b.lecons, 0)} leçons de plus, incluses elles aussi.</p>
          <div class="bonus-grille">
            ${reste.map((b) => ligneIncluse(b)).join('')}
          </div>
        </div>
      </div>

      <aside class="prix-panneau">
        <div class="bloc">
          <p class="prix-chapeau">Le palier 1 en entier</p>
          <p class="prix-grand nums">${fcfa(PRIX.entree)}</p>
          <p class="prix-sous">Une fois, et c’est à toi. Pas d’abonnement, rien à résilier.</p>
          <button type="button" class="bouton" data-aller="apres" data-plan="plein">
            Je prends le palier 1 — ${fcfa(PRIX.entree)}
          </button>
          <button type="button" class="bouton clair petit" data-aller="apres" data-plan="deux">
            Ou payer en deux fois — ${fcfa(PRIX.acompte)} aujourd’hui
          </button>
          <p class="prix-note">

            même minute, même total.
          </p>
          <div class="moyens">
            <b>Tu paies avec</b>
            <div class="jetons">${MOYENS.map((m) => `<span class="jeton">${ech(m)}</span>`).join('')}</div>
            <p class="rassure">
              <b>${TOTAL1.l} leçons, ${temps(TOTAL1.m)}</b> ouvertes tout de suite.
            </p>
            <p class="rassure">Accès immédiat dès que le paiement passe. Rien à installer.</p>
          </div>
          <a class="bouton-wa" href="${WA}" target="_blank" rel="noopener">

      s’ouvre déjà dessus. Clique pour voir :
      ${TOUTES.map((x) => `<button type="button" class="jeton" data-porte="${x.cle}"
        style="cursor:pointer;border:1px solid currentColor${x.cle === porteChoisie ? ';font-weight:700' : ''}"
        >${ech(x.pub)} <code>#${x.cle}</code></button>`).join(' ')}
    </div>
  </div>`;
}

/* ── 2. L'écran juste après le paiement ──────────────────────────────── */
function vueApres() {
  const p = laPorte();
  return `
  <div class="page">

    <div class="recu">

            <img src="couv/${x.cover}" alt="">

    <div class="note-test">

      Aucune offre supplémentaire ici, et c’est volontaire. Quelqu’un qui vient de payer
      veut voir ce qu’il a acheté, pas un deuxième prix. La vente suivante se fait des mois
      plus tard, quand il a gagné de l’argent avec la première.
    </div>
  </div>`;
}

/* ── 3. Le catalogue, une fois dans la plateforme ────────────────────── */
function tuile(b, palier, etat, prix) {
  const ferme = etat === 'ferme';
  return `
  <article class="tuile p${palier} ${ferme ? 'ferme' : ''}">
    <div class="haut">
      <div class="vign">
        <img src="couv/${b.cover}" alt="" loading="lazy">
        ${ferme ? `<span class="cadenas"><span>${VERROU}</span></span>` : ''}
      </div>
      <div class="corps">
        <h4>${ech(b.nom)}</h4>
        <p class="info">${b.lecons} leçons · ${temps(b.min)}</p>
      </div>
    </div>
    <div class="pied">
      <span class="etat ${etat}">${
        etat === 'a-toi' ? 'À toi'
          : prix ? fcfa(prix)
          // Les blocs des paliers 2 et 3 n'ont pas de prix à eux : ils ne se
          // vendent qu'ensemble. Un prix par bloc contredirait l'offre
          // groupée affichée juste en dessous.
          : `Dans le palier ${palier}`
      }</span>
      <span class="bouton-mini ${ferme ? '' : 'calme'}">${ferme ? 'Débloquer' : 'Regarder'}</span>
    </div>
    ${(LECONS[b.cover] || []).length === 0 ? '' : `
    <details>
      <summary class="voir"><span>Voir les ${b.lecons} leçons</span>${CHEVRON}</summary>
      ${sommaire(b.cover, ferme)}
    </details>`}
  </article>`;
}

  return `
  <div class="page large">
    <div class="carte">
      <nav class="rail">
        <span class="tete"><img src="${MARQUE}" alt="EcomLiberty"></span>
        <div class="liens">
          ${['Communauté', 'Programmes', 'Lives', 'Exclusif', 'Membres', 'Calendrier', 'Documents', 'À propos']
            .map((m, i) => `<span class="onglet" ${i === 1 ? 'data-actif' : ''}>${ech(m)}</span>`).join('')}
        </div>
      </nav>
      <div class="colonne">
        <div class="barre-app">
          <h2>Mes formations</h2>
          <span class="avatar">BM</span>
        </div>
        <div class="dedans-app">

          <div class="section-titre">
            <span class="numeral n1">1</span>
            <div><h3>De 0 à 2 millions</h3><p>${TOTAL1.l} leçons · ${temps(TOTAL1.m)} · tout est à toi</p></div>
          </div>
          <div class="grille">
            ${PALIER1.map((b) => tuile(b, 1, 'a-toi')).join('')}

          ${SUITE.map((n) => `
            <div class="section-titre">
              <span class="numeral n${n.num}">${n.num}</span>
              <div>
                <h3>${ech(n.titre)}</h3>

              <b>Les paliers 2 et 3, ensemble</b>
              <small>${TOTAL23} leçons. À prendre quand tu auras passé 2 millions — pas avant.</small>
            </div>
            <span class="bouton-mini">${fcfa(PRIX.suite)}</span>
          </div>

          <div class="note-test">
            <b>Note de test</b>
            Les blocs fermés gardent leur image, leur nombre de leçons et leur sommaire :
            on ne peut pas vouloir ce qu’on ne voit pas. Nulle part un tableau de tarifs —
            un prix n’apparaît qu’au cadenas. De bout en bout, ${fcfa(PRIX.entree)}
            puis ${fcfa(PRIX.suite)}, soit ${fcfa(PRIX.total)}.
          </div>
        </div>
      </div>
    </div>
  </div>`;
}

/* ── Le routeur ──────────────────────────────────────────────────────── */
let vue = 'vente';
let porteChoisie = 'alibaba';
const VUES = { vente: vueVente, apres: vueApres, dedans: vueDedans };

function rendre() {
  document.getElementById('ecran').innerHTML = VUES[vue]();
  for (const b of document.querySelectorAll('#choix button'))
    b.setAttribute('aria-pressed', String(b.dataset.vue === vue));
  window.scrollTo({ top: 0, behavior: 'instant' });
}

document.addEventListener('click', (e) => {
  const onglet = e.target.closest('#choix button');
  if (onglet) { vue = onglet.dataset.vue; location.hash = vue; return rendre(); }
  const aller = e.target.closest('[data-aller]');
  if (aller) {
    if (aller.dataset.plan) planChoisi = aller.dataset.plan;
    vue = aller.dataset.aller; location.hash = vue; return rendre();
  }
  const porte = e.target.closest('[data-porte]');
  if (porte) { porteChoisie = porte.dataset.porte; location.hash = porteChoisie; return rendre(); }
});

/*
 * Deux sortes de clés dans le même fragment, et c'est voulu : les trois vues
 * (#vente, #apres, #dedans) servent à montrer la maquette, les clés de porte
 * (#alibaba, #facebook, …) sont **les liens des publicités**. Une annonce
 * pointe sur sa clé, la page s'ouvre déjà sur la bonne promesse, et personne
 * n'a à choisir quoi que ce soit en arrivant.
 */
const VUES_CLES = new Set(['vente', 'apres', 'dedans']);
const PORTES_CLES = new Set(TOUTES.map((x) => x.cle));

function depuisHash() {
  const h = location.hash.slice(1);
  if (VUES_CLES.has(h)) return h;
  if (PORTES_CLES.has(h)) { porteChoisie = h; return 'vente'; }
  return 'vente';
}
window.addEventListener('hashchange', () => { vue = depuisHash(); rendre(); });
vue = depuisHash();
rendre();
</script>
